<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover"
    />
    <link rel="stylesheet" href="style.css" />
    <title>TeamPulse | Smart Project Hub</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231e293b' rx='20'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23facc15' font-family='Arial'%3E📊%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="loginContainer" class="login-container">
      <div class="login-card">
        <h2>📊 TeamPulse</h2>
        <input type="text" id="loginName" placeholder="Full name" />
        <select id="loginRole">
          <option value="Project Manager">👔 Project Manager (Boss)</option>
          <option value="Developer">💻 Developer</option>
          <option value="Designer">🎨 Designer</option>
          <option value="Content Writer">✍️ Content Writer</option>
          <option value="HR">🤝 HR</option>
          <option value="QA">🧪 QA</option>
        </select>
        <button id="loginBtn">Enter Workspace →</button>
        <div id="loginError" class="error-msg"></div>
      </div>
    </div>

    <div id="mainApp" style="display: none">
      <div class="app-wrapper">
        <div class="sidebar">
          <div class="profile-area">
            <div class="avatar" id="profileAvatar">👤</div>
            <h3 id="sidebarUserName">User</h3>
            <div class="role-badge" id="sidebarUserRole">Role</div>
          </div>
          <div class="nav-menu">
            <button class="nav-item active" data-view="tasks">
              <span class="nav-icon">📋</span> <span>Tasks</span>
            </button>
            <button class="nav-item" data-view="chat">
              <span class="nav-icon">💬</span> <span>Chat</span>
            </button>
            <button
              class="nav-item"
              id="teamNavBtn"
              style="display: none"
              data-view="team"
            >
              <span class="nav-icon">👥</span> <span>Team</span>
            </button>
          </div>
          <button id="logoutBtnSidebar" class="logout-sidebar">
            🚪 Logout
          </button>
        </div>
        <div class="main-content">
          <div id="tasksView"></div>
          <div id="chatView" style="display: none">
            <div class="card-panel" style="padding: 0">
              <div class="chat-room">
                <div class="messages-area" id="chatMessagesList"></div>
                <div class="chat-input">
                  <input
                    type="text"
                    id="chatMsgInput"
                    placeholder="Type a message..."
                  />
                  <button id="sendChatBtn" class="primary">Send</button>
                </div>
              </div>
            </div>
          </div>
          <div id="teamView" style="display: none">
            <div class="card-panel">
              <h3>👥 Team Management</h3>
              <div class="form-grid">
                <input
                  type="text"
                  id="newMemberName"
                  placeholder="Member name"
                />
                <select id="newMemberRole">
                  <option value="Developer">💻 Developer</option>
                  <option value="Designer">🎨 Designer</option>
                  <option value="Content Writer">✍️ Content Writer</option>
                  <option value="HR">🤝 HR</option>
                  <option value="QA">🧪 QA</option>
                  <option value="Project Manager">👔 Project Manager</option>
                </select>
                <button id="addMemberBtn" class="primary">➕ Add</button>
              </div>
              <div id="memberListContainer" class="member-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
